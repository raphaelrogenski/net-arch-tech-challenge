apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-sqlserver
  namespace: tech-challenge
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: sqlserver.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: svc-sqlserver
                port:
                  number: 1433
